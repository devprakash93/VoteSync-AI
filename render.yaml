services:
  # Backend Web Service
  - type: web
    name: votesync-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # Frontend Static Site
  - type: static
    name: votesync-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
